[package]
name = "mcp-plugin-math"
version = "0.1.0"
edition = "2021"
authors = ["Nhan-209"]
description = "High-performance Rust MCP Server for AI Metacognition & Formal Mathematical Verification"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Nhan-209/mcp-plugin-math"

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.7"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
