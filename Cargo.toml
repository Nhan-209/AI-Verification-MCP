[package]
name = "mcp-plugin-math"
version = "0.3.0"
edition = "2021"
authors = ["Nhan-209"]
description = "High-performance Rust MCP Server for AI Metacognition & Formal Mathematical Verification"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Nhan-209/mcp-plugin-math"

[features]
default = ["lang-rust", "lang-typescript", "lang-python"]
lang-rust = ["dep:tree-sitter-rust"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
all-languages = [
    "lang-rust",
    "lang-typescript",
    "lang-python",
    "lang-go",
    "lang-java",
    "lang-c",
    "lang-cpp",
]

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = "0.7"
tree-sitter = "0.24"
flate2 = "1.0"

# Language grammars (optional, controlled by feature flags)
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
