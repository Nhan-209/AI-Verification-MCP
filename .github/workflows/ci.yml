name: Rust CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Ensure and commit Cargo.lock
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: commit Cargo.lock for reproducible builds" || true
            git push origin HEAD || true
          fi

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

  check-and-test:
    name: Check, Test & Build (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Ensure Cargo.lock exists
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy Default Features
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Clippy All Features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run Tests (Default Features)
        run: cargo test --all-targets --locked --verbose

      - name: Run Tests (All Features)
        run: cargo test --all-targets --all-features --locked --verbose

      - name: Build Release
        run: cargo build --release --all-features --locked --verbose

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-verification-mcp-${{ matrix.os }}
          path: |
            target/release/ai-verification-mcp
            target/release/ai-verification-mcp.exe
            target/release/mcp-plugin-math
            target/release/mcp-plugin-math.exe
          if-no-files-found: ignore
