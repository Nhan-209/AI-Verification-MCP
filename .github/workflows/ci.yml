name: Rust CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    # Only run on PRs; on push to main, files are already formatted.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit if needed
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- '*.rs'; then
            git commit -am "chore(fmt): auto-format Rust source [skip ci]"
            git push
          else
            echo "All files already formatted."
          fi

  check-and-test:
    name: Check, Test & Build (${{ matrix.os }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Clippy Default Features
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy All Features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests (Default Features)
        run: cargo test --all-targets --verbose

      - name: Run Tests (All Features)
        run: cargo test --all-targets --all-features --verbose

      - name: Build Release
        run: cargo build --release --all-features --verbose

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-verification-mcp-${{ matrix.os }}
          path: |
            target/release/ai-verification-mcp
            target/release/ai-verification-mcp.exe
            target/release/mcp-plugin-math
            target/release/mcp-plugin-math.exe
          if-no-files-found: ignore
